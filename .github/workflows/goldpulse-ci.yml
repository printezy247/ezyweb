name: GoldPulse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: printezy-9-products/apps/goldpulse
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Smoke-test data feeds
        run: python data.py

      - name: Run tests
        run: pytest tests/ -q

      - name: Syntax check bot modules
        run: python -m py_compile bot.py data.py store.py config.py
