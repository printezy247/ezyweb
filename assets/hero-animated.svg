<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 120" width="1280" height="120" role="img" aria-label="printezy ezyweb footer">
  <defs>
    <linearGradient id="foot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0b429"><animate attributeName="stop-color" values="#f0b429;#00e5ff;#ff4d6d;#f0b429" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#ff4d6d;#f0b429;#00e5ff" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="sweepF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="120" fill="#050a13"/>
  <rect y="0" width="1280" height="3" fill="url(#sweepF)"/>
  <g font-family="Verdana,DejaVu Sans,sans-serif" text-anchor="middle">
    <text x="640" y="58" font-size="30" font-weight="bold" fill="url(#foot)" letter-spacing="1">printezy · ezyweb</text>
    <text x="640" y="86" font-size="13" fill="#8fa3c0" letter-spacing="2">BUILT FOR TRADERS · FREE FOREVER · NO SUBSCRIPTIONS ON FREE TIERS</text>
  </g>
</svg>
